# ======================================================================
#  OctaGens - config.yml
#  Reload dengan /octagens reload (kecuali bagian "database": butuh restart).
#  Format teks: MiniMessage (<red>, <gradient:#a:#b>...</gradient>, <bold>),
#  legacy (&a, &l) dan hex (&#RRGGBB atau <#RRGGBB>) didukung di semua teks.
# ======================================================================

# ----------------------------------------------------------------------
# DATABASE (semua I/O berjalan async)
# ----------------------------------------------------------------------
database:
  type: SQLITE                 # SQLITE (default) atau MYSQL (MariaDB juga bisa)
  sqlite-file: "octagens.db"   # relatif terhadap folder plugin
  mysql:
    host: "localhost"
    port: 3306
    database: "octagens"
    username: "root"
    password: ""
    use-ssl: false
    pool-size: 8

# ----------------------------------------------------------------------
# UMUM
# ----------------------------------------------------------------------
general:
  debug: false
  # Currency default bila generator/resep tidak menulis "currency".
  # Format: "vault" atau "excellenteconomy:<currency_id>"
  default-currency: "vault"

# ----------------------------------------------------------------------
# FORMAT ANGKA / UANG
# ----------------------------------------------------------------------
format:
  money-short: true            # true = 1.2M, 10B ; false = 1,200,000
  currency-formats:            # {amount} = jumlah, {currency} = id currency
    vault: "${amount}"
    default: "{amount} {currency}"
    # "excellenteconomy:gems": "{amount} Gems"

# ----------------------------------------------------------------------
# SLOT (batas jumlah). Nilai TERTINGGI dari permission dipakai.
#   octagens.generatorslot.<jumlah> / octagens.generatorslot.*  (tak terbatas)
#   octagens.energyslot.<jumlah>    / octagens.energyslot.*
#   octagens.admin.bypass = tanpa batas
# Slot bonus dari API/command ditambahkan di atas nilai ini.
# ----------------------------------------------------------------------
slots:
  default-generators: 10
  default-energy: 10

# ----------------------------------------------------------------------
# GENERATOR
# ----------------------------------------------------------------------
generators:
  only-when-owner-online: false     # true = hanya jalan saat owner online
  max-stored-drops: 512             # batas total item drop (jumlah item, bukan stack) di sekitar generator.
                                    # Bila penuh generator berhenti sementara sampai item diambil.
  require-free-space-above: true    # block di atas generator harus kosong/passable
  drop-invulnerable: true           # item drop tidak hancur oleh lava/ledakan
  pickup-require-empty-hand: false  # true = pickup (jongkok + klik kiri) hanya bisa dengan tangan kosong
  manage-gui: true                  # klik kanan generator (tanpa sneak) membuka GUI manage
                                    # PICKUP: jongkok (sneak) + KLIK KIRI pada generator/energy
  tick-interval-ticks: 10           # periode scheduler tunggal (semua generator diproses 1 task)
  full-recheck-ticks: 40            # interval cek ulang generator yang penuh
  blacklisted-worlds: []            # world yang tidak boleh dipasang generator/energy

# ----------------------------------------------------------------------
# ENERGY (Magicule, satuan Mcu)
#   - Setiap pemain punya SATU pool Mcu. Energy yang dipasang meregen Mcu/s ke pool (sampai penuh).
#   - Generator hanya drop jika ada energy milik pemain dalam radius max-distance DAN pool >= energy-requirement
#     generator (lihat generators.yml). Tiap drop MENGONSUMSI Mcu sebesar energy-requirement.
#   - Sebelum Mcu cukup, generator berstatus "Energy kurang" dan menunggu (progress tidak hilang).
#   - Pool disimpan di database (autosave + saat pemain keluar) dan tetap regen walau pemain offline.
# ----------------------------------------------------------------------
energy:
  required: true          # false = generator drop tanpa mengonsumsi Mcu (energy dinonaktifkan)
  max-default: 2000       # Mcu maksimum default setiap pemain
  max-limit: 10000000     # batas MAKSIMAL Mcu maksimum (hasil upgrade tidak bisa melewati ini)
  upgrade:                # upgrade Mcu maksimum dengan uang (GUI Magicule Shop atau /octagens upgrade)
    step: 1000            # tiap 1 level menambah Mcu maksimum sebesar ini
    currency: "vault"     # "vault" atau "excellenteconomy:<id>"
    # Harga level ke-L (mulai L=0) = cost-base * (1 + L * cost-increase)
    cost-base: 5000000
    cost-increase: 0.25
  autosave-seconds: 300   # interval simpan pool ke database (async)
  max-distance: 64        # radius maksimum energy -> generator (block), world harus sama
  distance-mode: "3D"     # 3D (xyz) atau 2D (abaikan Y)
  shared-energy: false    # true = energy pemain lain di dekat generator juga dihitung sebagai "terhubung"
                          # (pool yang dipakai tetap milik pemilik generator)

# ----------------------------------------------------------------------
# HOLOGRAM (TextDisplay) - hanya muncul SEJENAK lalu dihapus supaya tidak lag.
# Muncul saat: generator dipasang, pemain klik generator, dan (opsional) saat drop bila ada pemain di dekatnya.
# Placeholder: {name} {owner} {tier} {pool} {pool_max} {regen} {required} {efficiency} {status}
#              {drop_name} {interval} {amount} {sell_price}
# ----------------------------------------------------------------------
hologram:
  enabled: true
  height: 1.9                  # tinggi di atas dasar block
  duration-ticks: 80           # lama tampil (20 ticks = 1 detik)
  show-on:
    place: true
    interact: true
    drop: true
  drop-nearby-radius: 8        # saat drop: tampil hanya jika ada pemain dalam radius ini
  drop-cooldown-ticks: 100     # jeda minimum antar kemunculan akibat drop (anti spam entity)
  view-range: 0.6              # pengali jarak pandang (1.0 = ~64 block)
  lines:
    - "{name}"
    - "<gray>Pemilik: <white>{owner}"
    - "<gray>Mcu: <aqua>{pool}<dark_gray>/<aqua>{pool_max} <dark_gray>| <gray>Butuh <aqua>{required}"
    - "{status}"
  status:
    ACTIVE: "<green>Aktif"
    NO_ENERGY: "<red>Energy kurang"
    NO_CAPACITY: "<red>Max Mcu kurang <gray>(upgrade)"
    NOT_CONNECTED: "<red>Tidak ada energy di dekat"
    FULL: "<yellow>Penuh - ambil dropnya"
    OWNER_OFFLINE: "<gray>Owner offline"
    UNKNOWN: "<dark_red>Tipe tidak dikenal"

# ----------------------------------------------------------------------
# WEEKEND BONUS (extra drop 2x - 4x)
# Server memakai UTC (GMT+0), pemain Indonesia memakai WIB (GMT+7).
# Perhitungan jendela waktu memakai "timezone"; semua teks/placeholder waktu
# ditampilkan memakai "display-timezone".
#   Sabtu  00:00 UTC = Sabtu  07:00 WIB   (awal bonus)
#   Minggu 23:59 UTC = Senin  06:59 WIB   (akhir bonus)
# ----------------------------------------------------------------------
weekend-bonus:
  enabled: true
  timezone: "UTC"                    # acuan perhitungan
  start: "SATURDAY 00:00"
  end: "SUNDAY 23:59"                # inklusif sampai detik ke-59 menit ini
  min-multiplier: 2
  max-multiplier: 4
  # RANDOM_PER_DROP    = acak tiap drop (min..max)
  # FIXED_PER_WEEKEND  = satu nilai acak per akhir pekan (stabil sampai restart pun)
  # FIXED_PER_DAY      = satu nilai acak per hari
  mode: RANDOM_PER_DROP
  display-timezone: "Asia/Jakarta"   # WIB
  display-label: "WIB"
  display-locale: "id-ID"
  display-format: "EEEE HH:mm"
  broadcast:
    start: true
    end: true
  display: BOSSBAR                   # BOSSBAR | ACTIONBAR | NONE
  bossbar:
    color: PURPLE
    style: SEGMENTED_10
  manual-default-duration: "1h"      # default durasi /octagens setbonus <x> (tanpa durasi)

# ----------------------------------------------------------------------
# SELL
# Multiplier jual: permission octagens.sellmultiplier.<angka> (mis. octagens.sellmultiplier.1.5)
# ----------------------------------------------------------------------
sell:
  cooldown-ms: 1000
  sell-gui: false          # true = /octagens sell membuka GUI konfirmasi (guis/sell.yml)

shop:
  confirm-gui: true        # true = klik item shop membuka GUI konfirmasi (guis/confirm.yml)

# Sellwand (tongkat jual isi chest/container) diatur lengkap di sellwand.yml

# ----------------------------------------------------------------------
# KEAMANAN
# ----------------------------------------------------------------------
security:
  gui-click-cooldown-ms: 150
  large-transaction-threshold: 1000000000   # transaksi >= nilai ini dicatat sebagai WARNING di console
  protection:
    block-piston: true         # generator/energy tidak bisa didorong piston
    block-explosion: true      # generator/energy tidak hancur oleh ledakan
    block-dispenser: true      # item generator/energy tidak bisa di-dispense
    block-fluid: true          # air/lava tidak menimpa block
    allow-hopper-pickup: true  # false = hopper tidak bisa menyedot item drop

logging:
  sell-log: true               # tulis transaksi jual ke file
  purchase-log: true           # tulis transaksi beli ke file
  file: "sell-log.txt"

# CoreProtect (WAJIB terpasang). CoreProtect sudah mencatat BlockPlaceEvent biasa sendiri,
# jadi log-placement default false agar tidak ganda.
coreprotect:
  log-placement: false
  log-removal: true            # pickup/break/remove generator & energy
  log-oregen: true             # block hasil Stone/Basalt generator (user #octagens-oregen)
  log-transactions: true       # beli/jual/upgrade dicatat sebagai baris di riwayat player
  log-sellwand: true           # isi container yang dijual sellwand dicatat sebagai transaksi container

# Hook opsional (false = diabaikan walau plugin-nya terpasang)
hooks:
  mmoitems: true
  itemsadder: true
  excellenteconomy: true

performance:
  verify-blocks: true          # hapus registrasi bila block generator/energy hilang (WorldEdit dll)
