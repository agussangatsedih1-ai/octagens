# ======================================================================
#  OctaGens - energy.yml  (Magicule Power Collector, 10 tier)
#  Magicule Power Collector = player head dengan skin custom. Setiap collector yang dipasang meregen
#  Mcu per detik ke pool Mcu pemiliknya (lihat config.yml -> energy dan generators.yml).
#  Nama item otomatis diberi jumlah regen: "<display-name> [X Mcu/s]" (config.yml -> energy.item-name-suffix).
#
#  HEAD TEXTURE: kosong = collector memakai block cadangan (config.yml -> energy.fallback-block), tidak pernah
#  tampil sebagai head rusak. Cara tercepat mengisi texture: ambil head bertema "core" dari minecraft-heads.com,
#  pegang di tangan, lalu jalankan  /octagens settexture <id>  (disimpan di energy/textures.yml).
#  Boleh juga mengisi head-texture di sini dengan nilai "Value" (base64) atau URL textures.minecraft.net.
#
#  Field: id, display-name, head-texture, mcu-per-second, custom-model-data, lore
#  Placeholder lore: {name} {mcu}
# ======================================================================
