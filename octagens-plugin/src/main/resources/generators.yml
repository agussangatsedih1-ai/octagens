# ======================================================================
#  OctaGens - generators.yml  (20 generator, urutan sesuai shop-slot)
#
#  Field per generator:
#    id                    id unik (huruf kecil)
#    display-name          nama (gradient/hex/MiniMessage)
#    lore                  lore item generator. Placeholder: {name} {tier} {drop_name} {interval}
#                          {amount} {energy} {price} {sell_price}
#    block                 block yang dipasang. String ref ATAU section {item, name, lore, custom-model-data, glow}
#                          Ref: VANILLA:MATERIAL | MMOITEMS:TYPE:ID | ITEMSADDER:namespace:id | HEAD:<base64>
#    shop-price            harga di shop (angka besar aman, tipe double)
#    currency              "vault" atau "excellenteconomy:<currency_id>" (harga beli)
#    sell-currency         (opsional) currency saat menjual drop; default = currency
#    drop-interval-ticks   waktu antar drop (20 ticks = 1 detik). Setelah interval habis generator
#                          "siap drop", tetapi baru benar-benar drop kalau Mcu pemilik cukup.
#    drop-item             item drop: string ref ATAU section {item, name, lore, custom-model-data, glow}
#                          Lore drop memakai placeholder: {name} {tier} {drop_name} {interval} {amount}
#                          {energy} {price} {sell_price}  -> pemain bisa melihat harga jual langsung di item.
#    drop-amount           jumlah item per drop (dikali weekend bonus)
#    sell-price            harga jual PER ITEM drop
#    energy-requirement    Mcu yang DIKONSUMSI setiap kali generator drop (bukan Mcu/s!)
#    shop-slot             urutan tampil di shop (halaman dihitung otomatis)
#    shop-icon             (opsional) override ikon shop: section {item, name, lore, ...}
#    permission            (opsional) permission untuk membeli; kosong = bebas
#    effects               partikel + suara saat drop (sound = ID suara Minecraft)
#
#  CARA KERJA ENERGY (Magicule / Mcu)
#    - Tiap pemain punya satu pool Mcu. Semua energy yang dipasang pemain meregen Mcu/s ke pool itu,
#      sampai penuh (maksimum default 2000, bisa di-upgrade pakai uang; lihat config.yml -> energy).
#    - Generator hanya drop kalau (1) ada energy milik pemain dalam radius energy.max-distance dan
#      (2) isi pool >= energy-requirement generator itu. Tiap drop memotong pool sebesar energy-requirement.
#    - Sebelum pool mencapai energy-requirement generator berstatus "Energy kurang".
#    - Jika energy-requirement > Mcu maksimum pemain, generator berstatus "Max Mcu kurang" -> upgrade dulu.
#
#  RASIONAL energy-requirement (Mcu per drop). Regen energy: 0.5 / 1.2 / 4.8 / 16.2 / 24.6 /
#  120.5 / 200 / 210 / 250 / 500 Mcu/s.
#    Tier 1-5    (5-80)       : cukup dengan beberapa energy kecil (Glimmer Dust, Fey Spark, Lumina).
#    Tier 6-10   (120-500)    : butuh Hexa Flux / Wispfire / Ethereal Ichor agar tidak menunggu lama.
#    Tier 11-15  (650-1500)   : butuh beberapa Ethereal Ichor / Astralite; masih muat di Mcu maksimum default 2000.
#    Tier 16     (2000)       : persis kapasitas default; tiap drop menghabiskan seluruh pool.
#    Tier 17-20  (3000-12000) : WAJIB upgrade Mcu maksimum (> 2000) + regen besar (Spectral/Celestium/Origin Pulse).
# ======================================================================
