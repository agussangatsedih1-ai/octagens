# ======================================================================
#  OctaGens - generators.yml  (20 generator, urutan sesuai shop-slot)
#
#  Field per generator:
#    id                    id unik (huruf kecil)
#    display-name          nama (gradient/hex/MiniMessage)
#    lore                  lore item generator. Placeholder: {name} {tier} {drop_name} {interval}
#                          {amount} {energy} {price} {sell_price}
#    block                 block yang dipasang. String ref ATAU section {item, name, lore, custom-model-data, glow}
#                          Ref: VANILLA:MATERIAL | MMOITEMS:TYPE:ID | ITEMSADDER:namespace:id | HEAD:<base64>
#    shop-price            harga di shop (angka besar aman, tipe double)
#    currency              "vault" atau "excellenteconomy:<currency_id>" (harga beli)
#    sell-currency         (opsional) currency saat menjual drop; default = currency
#    drop-interval-ticks   interval drop dasar (20 ticks = 1 detik) pada efficiency 100%
#    drop-item             item drop: string ref ATAU section {item, name, lore, custom-model-data, glow}
#                          (bisa diganti ke MMOITEMS:/ITEMSADDER:)
#    drop-amount           jumlah drop per interval (dikali weekend bonus)
#    sell-price            harga jual PER ITEM drop
#    energy-requirement    kebutuhan energy (Mcu/s) untuk efficiency 100%
#    shop-slot             urutan tampil di shop (halaman dihitung otomatis)
#    shop-icon             (opsional) override ikon shop: section {item, name, lore, ...}
#    permission            (opsional) permission untuk membeli; kosong = bebas
#    effects               partikel + suara saat drop (sound = ID suara Minecraft, mis. entity.experience_orb.pickup)
#
#  RASIONAL energy-requirement (Mcu/s), skala energy: 0.5 / 1.2 / 4.8 / 16.2 / 24.6 / 120.5 / 200 / 210 / 250 / 500
#    Tier 1-5   (0.5-5)     : 1-5 energy kecil (Glimmer Dust/Fey Spark/Lumina) sudah cukup.
#    Tier 6-9   (8-30)      : butuh Lumina Essence / Hexa Flux / Wispfire.
#    Tier 10-12 (45-100)    : butuh beberapa Wispfire atau 1 Ethereal Ichor.
#    Tier 13-16 (140-450)   : butuh Ethereal Ichor / Astralite / Spectral Charge / Celestium.
#    Tier 17-20 (700-2500)  : butuh banyak energy mahal; Genesis Relic (2500) = 5x Origin Pulse.
#  Efficiency = min(1, supply / requirement). Supply 50% -> drop 50% lebih lambat.
# ======================================================================
