# All Giveaway Booster GUI visuals, titles, slots and lore are editable here.
layout:
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  border:
    enabled: true
    material: PURPLE_STAINED_GLASS_PANE
    name: " "
    slots: [0-8, 9, 17, 18, 26, 27, 35, 36-44]
  accents:
    material: YELLOW_STAINED_GLASS_PANE
    name: " "
    slots: [0, 8, 36, 44, 4, 40]

menus:
  category:
    rows: 5
    title: "<gradient:#8b5cf6:#f5c76a><bold>✦ OCTAGENS • BOOSTER EXCHANGE ✦</bold></gradient>"
    booster-slots: [20, 22, 24]
    icons:
      drop-booster: DIAMOND_BLOCK
      sell-booster: GOLD_INGOT
      mcu-booster: AMETHYST_SHARD
    header:
      slot: 4
      material: NETHER_STAR
      glow: true
      name: "<gradient:#f8d878:#fff0b3><bold>✦ THE BOOSTER VAULT ✦</bold></gradient>"
      lore:
        - "<gray>Server-wide enhancements"
        - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━"
        - "<white>Choose a booster category to begin."
        - "<gray>Every purchase is shared with the whole server."
        - ""
        - "<gold>✦ Duration is FREE"
        - "<yellow>✦ Price depends on multiplier."
    booster-item:
      glow: true
      name: "<gradient:#f8d878:#fff0b3><bold>✦ {name} ✦</bold></gradient>"
      lore:
        - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━"
        - "<light_purple>✧ <white>SERVER-WIDE BOOSTER"
        - "<gray>Current bonus: <green><bold>{multiplier}x"
        - "<gray>Price: <gold><bold>{price} <dark_gray>per <yellow>1.0x"
        - ""
        - "<gray>Choose the strength and duration."
        - "<gray>Duration is free of charge."
        - ""
        - "<yellow><bold>➜ SELECT BOOSTER"
    info:
      slot: 40
      material: BOOK
      name: "<aqua><bold>✧ HOW THE VAULT WORKS</bold>"
      lore:
        - "<gray>1. Choose a booster category."
        - "<gray>2. Select the multiplier you want."
        - "<gray>3. Choose how long it stays active."
        - ""
        - "<gold>✦ Your purchase boosts the whole server."
        - "<dark_gray>Automatic boosts are added to giveaway boosts."
    close:
      slot: 44
      material: BARRIER
      glow: false
      name: "<red><bold>✕ CLOSE MENU</bold>"
      lore: ["<gray>Return to the game."]

  multiplier:
    rows: 5
    title: "<gradient:#8b5cf6:#f5c76a><bold>✦ SELECT YOUR MULTIPLIER ✦</bold></gradient>"
    option-slots: [19, 20, 21, 22, 23, 24, 25, 26]
    header:
      slot: 4
      glow: true
      name: "<gradient:#f8d878:#fff0b3><bold>✦ {name} ✦</bold></gradient>"
      lore:
        - "<gray>Choose the strength of this server-wide boost."
        - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━"
        - "<gray>Custom values must be whole numbers from 1 to 10."
    info:
      slot: 13
      material: ENCHANTED_BOOK
      glow: true
      name: "<light_purple><bold>✧ BOOSTER DETAILS</bold>"
      lore:
        - "<gray>Current server bonus: <green><bold>{multiplier}x"
        - "<gray>Price per 1.0x: <gold>{price}"
        - "<gray>Selected booster: <white>{name}"
        - ""
        - "<yellow>✦ Select one of the options below."
    option-item:
      material: AMETHYST_SHARD
      glow: true
      name: "<gradient:#c084fc:#f5d0fe><bold>✦ {multiplier}x BOOST ✦</bold></gradient>"
      lore:
        - "<dark_gray>━━━━━━━━━━━━━━━━━━━━"
        - "<gray>Multiplier: <light_purple><bold>{multiplier}x"
        - "<gray>Final price: <gold><bold>{price}"
        - ""
        - "<green>✔ Duration is selected next."
        - "<yellow>➜ CLICK TO CONTINUE"
    custom:
      slot: 31
      material: NAME_TAG
      glow: true
      name: "<gradient:#f8d878:#fff0b3><bold>✎ CUSTOM MULTIPLIER</bold></gradient>"
      lore:
        - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━"
        - "<gray>Choose a whole number from <white>{min} <gray>to <white>{max}."
        - "<red>Decimals are not accepted."
        - "<yellow>➜ CLICK, THEN TYPE IN CHAT"
    back:
      slot: 40
      material: ARROW
      name: "<aqua><bold>↶ BACK</bold>"
      lore: ["<gray>Return to the previous step."]
    close:
      slot: 44
      material: BARRIER
      name: "<red><bold>✕ CLOSE MENU</bold>"
      lore: ["<gray>Cancel this purchase."]

  duration:
    rows: 5
    title: "<gradient:#8b5cf6:#f5c76a><bold>✦ CHOOSE BOOST DURATION ✦</bold></gradient>"
    duration-slots: [19, 20, 21, 22, 23, 24, 25, 26]
    header:
      slot: 4
      material: CLOCK
      glow: true
      name: "<gradient:#f8d878:#fff0b3><bold>✦ ACTIVATE YOUR BOOST ✦</bold></gradient>"
      lore:
        - "<gray>One final step before activating the giveaway."
        - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━"
        - "<gray>Booster: <white>{name}"
        - "<gray>Multiplier: <light_purple><bold>{multiplier}x"
        - "<gray>Purchase price: <gold><bold>{price}"
        - "<green>✔ Duration is FREE"
    summary:
      slot: 13
      material: NETHER_STAR
      glow: true
      name: "<gold><bold>✧ YOUR GIVEAWAY SUMMARY</bold>"
      lore:
        - "<gray>Booster: <white>{name}"
        - "<gray>Multiplier: <light_purple><bold>{multiplier}x"
        - "<gray>Price: <gold><bold>{price}"
        - "<gray>Duration: <aqua>Choose below"
        - ""
        - "<yellow>✦ Duration adds no extra cost."
    duration-item:
      material: CLOCK
      glow: true
      name: "<gradient:#7dd3fc:#dbeafe><bold>⌛ {duration}</bold></gradient>"
      lore:
        - "<dark_gray>━━━━━━━━━━━━━━━━━━━━"
        - "<gray>Boost duration: <aqua><bold>{duration}"
        - "<gray>Multiplier: <light_purple><bold>{multiplier}x"
        - "<gray>Additional duration cost: <green>FREE"
        - ""
        - "<yellow>➜ ACTIVATE FOR {duration}"
    back:
      slot: 40
      material: ARROW
      name: "<aqua><bold>↶ BACK</bold>"
      lore: ["<gray>Return to multiplier selection."]
    close:
      slot: 44
      material: BARRIER
      name: "<red><bold>✕ CLOSE MENU</bold>"
      lore: ["<gray>Cancel this purchase."]
