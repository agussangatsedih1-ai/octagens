# Every visual setting for /dailymissions is configurable here.
menu:
  rows: 6
  title: "<gradient:#8b5cf6:#ec4899><bold>✦ DAILY MISSIONS ✦</bold></gradient>"
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  border:
    enabled: true
    material: PURPLE_STAINED_GLASS_PANE
    name: " "
    slots: [0-8, 9, 17, 18, 26, 27, 35, 36-44, 45-53]
  accents:
    material: AMETHYST_SHARD
    name: " "
    slots: [4]
  # The order of missions in missions/daily-missions.yml follows this slot list.
  mission-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]

decorations:
  header:
    slot: 4
    material: NETHER_STAR
    glow: true
    name: "<gradient:#f8d878:#fff1b8><bold>✦ THE DAILY TRIALS ✦</bold></gradient>"
    lore:
      - "<gray>Complete missions and claim rewards."
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━"
      - "<gold>✧ <white>Progress resets every day at <yellow>00:00 WIB"
      - "<gold>✧ <white>Claim each reward before reset."
  close:
    slot: 49
    material: BARRIER
    name: "<red><bold>✕ CLOSE MENU</bold>"
    lore:
      - "<gray>Return to your adventure."

mission-items:
  # Optional per-mission overrides. Mission progress/targets/rewards stay in missions/daily-missions.yml.
  icons:
    sell-generator-drop: HOPPER
    upgrade-mpc: AMETHYST_SHARD
    upgrade-generator: BLAST_FURNACE
    buy-generator: DISPENSER
    buy-mpc: AMETHYST_BLOCK
    playtime-5m: CLOCK
    playtime-10m: CLOCK
    playtime-15m: CLOCK
    playtime-30m: CLOCK
    playtime-1h: CLOCK
    playtime-6h: CLOCK
    playtime-10h: CLOCK
    playtime-12h: CLOCK
    playtime-20h: CLOCK
  names:
    playtime-5m: "Playtime • 5 Minutes"
    playtime-10m: "Playtime • 10 Minutes"
    playtime-15m: "Playtime • 15 Minutes"
    playtime-30m: "Playtime • 30 Minutes"
    playtime-1h: "Playtime • 1 Hour"
    playtime-6h: "Playtime • 6 Hours"
    playtime-10h: "Playtime • 10 Hours"
    playtime-12h: "Playtime • 12 Hours"
    playtime-20h: "Playtime • 20 Hours"
  reward-format: "<gold>✦ <white>{reward}"
  in-progress:
    name: "<gradient:#cbd5e1:#ffffff><bold>◈ {name}</bold></gradient>"
    glow: false
    lore:
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━"
      - "<gray>PROGRESS <dark_gray>• <aqua>{percent}%"
      - "<white>{progress} <dark_gray>/ <white>{target}"
      - ""
      - "<gold><bold>REWARDS"
      - "{rewards}"
      - ""
      - "<gray>◷ Mission in progress"
      - "<dark_gray>Keep going. You're getting there!"
  ready:
    name: "<gradient:#f8d878:#fff1b8><bold>✦ {name}</bold></gradient>"
    glow: true
    lore:
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━"
      - "<gray>PROGRESS <dark_gray>• <green>100%"
      - "<white>{progress} <dark_gray>/ <white>{target}"
      - ""
      - "<gold><bold>REWARDS"
      - "{rewards}"
      - ""
      - "<green><bold>✔ MISSION COMPLETED"
      - "<yellow>➜ CLICK TO CLAIM REWARD"
  claimed:
    name: "<gradient:#86efac:#bbf7d0><bold>✔ {name}</bold></gradient>"
    glow: false
    lore:
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━"
      - "<gray>PROGRESS <dark_gray>• <green>100%"
      - "<white>{progress} <dark_gray>/ <white>{target}"
      - ""
      - "<gold><bold>REWARDS"
      - "{rewards}"
      - ""
      - "<green>✔ REWARD CLAIMED"
      - "<dark_gray>Come back tomorrow for new missions."
