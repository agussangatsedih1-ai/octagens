# ======================================================================
#  OctaGens - guis/energyshop.yml  (Magicule Shop: beli collector + upgrade Mcu maksimum)
#  Dibuka dengan /octagens magiculeshop.
#  entry-lore placeholder: {price} {status} {ingredients} {mcu} {name}
#  function: UPGRADE = tombol upgrade Mcu maksimum. Placeholder: {mcu} {mcu_max} {regen} {level} {step}
#            {next_max} {price} {price10} {limit} {remaining}.  Aksi: [upgrade] [upgrade:10] [upgrade:max]
#  Teks memakai token {lang:kunci} dari folder lang/.
# ======================================================================
title: "<gradient:#f093fb:#f5576c><bold>Magicule Shop</bold></gradient> <dark_gray>({page}/{pages})"
rows: 4
filler:
  item: "VANILLA:BLACK_STAINED_GLASS_PANE"
  name: " "
content-slots: ["10-16", "19-21"]
entry-lore:
  - ""
  - "<gray>❖ {lang:gui-entry-price}"
  - "<gray>{lang:gui-entry-ingredients}"
  - "{ingredients}"
  - ""
  - "<gray>{lang:gui-entry-status}"
  - "<yellow>➤ {lang:gui-click-buy}"
items:
  upgrade:
    slot: 23
    function: UPGRADE
    item: "VANILLA:EXPERIENCE_BOTTLE"
    name: "<gradient:#43e97b:#38f9d7><bold>{lang:gui-up-name}</bold></gradient>"
    glow: true
    lore:
      - "<gray>⚡ {lang:gui-up-mcu}"
      - "<gray>✦ {lang:gui-up-regen}"
      - "<gray>❖ {lang:gui-up-level}"
      - "<gray>{lang:gui-up-limit}"
      - ""
      - "<gray>{lang:gui-up-next}"
      - "<gray>{lang:gui-up-price1}"
      - "<gray>{lang:gui-up-price10}"
      - ""
      - "<yellow>➤ {lang:gui-up-left}"
      - "<yellow>➤ {lang:gui-up-right}"
    left-actions: ["[upgrade]"]
    right-actions: ["[upgrade:10]"]
  prev:
    slot: 30
    function: PREV
    item: "VANILLA:ARROW"
    name: "<yellow>{lang:gui-prev}"
  close:
    slot: 31
    item: "VANILLA:BARRIER"
    name: "<red>{lang:gui-close}"
    actions: ["[close]"]
  back:
    slot: 27
    item: "VANILLA:OAK_DOOR"
    name: "<gray>{lang:gui-main-menu}"
    actions: ["[open:main]"]
  next:
    slot: 32
    function: NEXT
    item: "VANILLA:ARROW"
    name: "<yellow>{lang:gui-next}"
