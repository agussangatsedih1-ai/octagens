# ======================================================================
#  OctaGens - guis/manage.yml  (kelola generator: klik kanan generator tanpa sneak)
#  function: INFO = item info generator (name/lore dari section ini, placeholder diisi otomatis)
#  Placeholder: {name} {owner} {tier} {supply} {required} {efficiency} {status}
#               {drop_name} {amount} {interval} {sell_price} {x} {y} {z} {world} {multiplier}
#  Aksi internal: [pickup] mengambil generator kembali ke inventory
# ======================================================================
title: "<dark_gray>Kelola generator"
rows: 3
filler:
  item: "VANILLA:BLACK_STAINED_GLASS_PANE"
  name: " "
items:
  info:
    slot: 13
    function: INFO
    item: "VANILLA:PAPER"
    name: "{name}"
    glow: true
    lore:
      - "<gray>Pemilik: <white>{owner}"
      - "<gray>Lokasi: <white>{x}, {y}, {z} <dark_gray>({world})"
      - ""
      - "<gray>Drop: <white>{amount}x {drop_name} <gray>/ <white>{interval}s"
      - "<gray>Weekend bonus: <white>{multiplier}"
      - "<gray>Energy: <aqua>{supply}<dark_gray>/<aqua>{required} Mcu/s <gray>(<white>{efficiency}<gray>)"
      - "<gray>Status: {status}"
  pickup:
    slot: 11
    item: "VANILLA:HOPPER"
    name: "<yellow><bold>Ambil generator"
    lore:
      - "<gray>Kembalikan generator ke inventory."
    actions: ["[pickup]"]
  close:
    slot: 15
    item: "VANILLA:BARRIER"
    name: "<red>Tutup"
    actions: ["[close]"]
