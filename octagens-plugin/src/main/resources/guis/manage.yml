# ======================================================================
#  OctaGens - guis/manage.yml  (kelola generator: klik kanan generator tanpa sneak)
#  function: INFO = item info generator (name/lore dari section ini, placeholder diisi otomatis)
#  Placeholder: {name} {owner} {tier} {pool} {pool_max} {regen} {required} {efficiency} {status}
#               {drop_name} {amount} {interval} {sell_price} {x} {y} {z} {world} {multiplier}
#               Tier berikutnya: {next_name} {next_tier} {next_drop_name} {next_sell_price} {next_energy}
#               {next_interval} {next_amount} {upgrade_price}
#  function: UPGRADE_GENERATOR = ikon upgrade ke tier berikutnya (harga = harga shop tier berikutnya,
#            atau selisihnya bila generators.upgrade.price-mode: DIFFERENCE di config.yml)
#  Aksi internal: [pickup] mengambil generator kembali ke inventory, [upgrade-generator] upgrade tier
#  Teks memakai token {lang:kunci} dari folder lang/.
# ======================================================================
title: "<dark_gray>{lang:gui-manage-title}"
rows: 3
filler:
  item: "VANILLA:BLACK_STAINED_GLASS_PANE"
  name: " "
items:
  info:
    slot: 13
    function: INFO
    item: "VANILLA:PAPER"
    name: "{name}"
    glow: true
    lore:
      - "<gray>♛ {lang:gui-manage-owner}"
      - "<gray>◈ {lang:gui-manage-location}"
      - ""
      - "<gray>✦ {lang:gui-manage-drop}"
      - "<gray>✦ {lang:lore-gen-sell}"
      - "<gray>❖ {lang:gui-manage-boost}"
      - "<gray>⚡ {lang:gui-manage-mcu}"
      - "<gray>⚡ {lang:gui-manage-cost}"
      - "<gray>{lang:gui-entry-status}"
  upgrade:
    slot: 11
    function: UPGRADE_GENERATOR
    item: "VANILLA:NETHER_STAR"
    name: "<gradient:#43e97b:#38f9d7><bold>{lang:gui-manage-up-name}</bold></gradient>"
    glow: true
    lore:
      - "<gray>{lang:gui-manage-up-tier}"
      - "<gray>➤ {lang:gui-manage-up-next}"
      - "<gray>{lang:gui-manage-up-drop}"
      - "<gray>{lang:gui-manage-up-sell}"
      - "<gray>{lang:gui-manage-up-cost}"
      - ""
      - "<gray>❖ {lang:gui-manage-up-price}"
      - "<yellow>➤ {lang:gui-click-upgrade}"
    actions: ["[upgrade-generator]"]
  pickup:
    slot: 15
    item: "VANILLA:HOPPER"
    name: "<yellow><bold>{lang:gui-manage-pickup-name}"
    lore:
      - "<gray>{lang:gui-manage-pickup-lore}"
    actions: ["[pickup]"]
  close:
    slot: 22
    item: "VANILLA:BARRIER"
    name: "<red>{lang:gui-close}"
    actions: ["[close]"]
