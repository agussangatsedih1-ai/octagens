# ======================================================================
#  OctaGens - guis/manage.yml  (kelola generator: klik kanan generator tanpa sneak)
#  function: INFO = item info generator (name/lore dari section ini, placeholder diisi otomatis)
#  Placeholder: {name} {owner} {tier} {pool} {pool_max} {regen} {required} {efficiency} {status}
#               {drop_name} {amount} {interval} {sell_price} {x} {y} {z} {world} {multiplier}
#               Tier berikutnya: {next_name} {next_tier} {next_drop_name} {next_sell_price} {next_energy}
#               {next_interval} {next_amount} {upgrade_price}
#  function: UPGRADE_GENERATOR = ikon upgrade ke tier berikutnya (harga = harga shop tier berikutnya,
#            atau selisihnya bila generators.upgrade.price-mode: DIFFERENCE di config.yml)
#  Aksi internal: [pickup] mengambil generator kembali ke inventory, [upgrade-generator] upgrade tier
# ======================================================================
title: "<dark_gray>Kelola generator"
rows: 3
filler:
  item: "VANILLA:BLACK_STAINED_GLASS_PANE"
  name: " "
items:
  info:
    slot: 13
    function: INFO
    item: "VANILLA:PAPER"
    name: "{name}"
    glow: true
    lore:
      - "<gray>Pemilik: <white>{owner}"
      - "<gray>Lokasi: <white>{x}, {y}, {z} <dark_gray>({world})"
      - ""
      - "<gray>Drop: <white>{amount}x {drop_name} <gray>/ <white>{interval}s"
      - "<gray>Weekend bonus: <white>{multiplier}"
      - "<gray>Mcu pemilik: <aqua>{pool}<dark_gray>/<aqua>{pool_max} <gray>(+<aqua>{regen}<gray>/s)"
      - "<gray>Konsumsi per drop: <aqua>{required} Mcu <gray>(siap: <white>{efficiency}<gray>)"
      - "<gray>Harga jual drop: <green>{sell_price} <gray>per item"
      - "<gray>Status: {status}"
  upgrade:
    slot: 11
    function: UPGRADE_GENERATOR
    item: "VANILLA:NETHER_STAR"
    name: "<gradient:#43e97b:#38f9d7><bold>Upgrade Generator</bold></gradient>"
    glow: true
    lore:
      - "<gray>Tier sekarang: <white>#{tier}"
      - "<gray>Naik ke: {next_name} <dark_gray>(#{next_tier})"
      - "<gray>Drop: <white>{next_drop_name}"
      - "<gray>Harga jual: <green>{next_sell_price} <gray>per item"
      - "<gray>Konsumsi: <aqua>{next_energy} Mcu <gray>per drop"
      - ""
      - "<gray>Harga upgrade: <gold>{upgrade_price}"
      - "<yellow>Klik untuk upgrade"
    actions: ["[upgrade-generator]"]
  pickup:
    slot: 15
    item: "VANILLA:HOPPER"
    name: "<yellow><bold>Ambil generator"
    lore:
      - "<gray>Kembalikan generator ke inventory."
    actions: ["[pickup]"]
  close:
    slot: 22
    item: "VANILLA:BARRIER"
    name: "<red>Tutup"
    actions: ["[close]"]
