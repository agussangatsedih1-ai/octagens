# Dedicated Max Magicule upgrade menu, opened by /mpc upgrade or Shift + Right Click on an MPC.
title: "<gradient:#43e97b:#38f9d7><bold>Max Magicule Upgrade</bold></gradient>"
rows: 3
filler:
  item: "VANILLA:BLACK_STAINED_GLASS_PANE"
  name: " "
items:
  upgrade:
    slot: 13
    function: UPGRADE
    item: "VANILLA:EXPERIENCE_BOTTLE"
    name: "<gradient:#43e97b:#38f9d7><bold>Upgrade Max Magicule</bold></gradient>"
    glow: true
    lore:
      - "<gray>Current Magicule: <aqua>{mcu} / {mcu_max}"
      - "<gray>Current Level: <white>{level}"
      - "<gray>Regeneration: <green>{regen} MCu/s"
      - ""
      - "<gray>Next Max: <aqua>{next_max} MCu"
      - "<gray>Upgrade Cost: <gold>{price}"
      - "<gray>10 Upgrade Cost: <gold>{price10}"
      - "<gray>Remaining Levels: <white>{remaining}"
      - ""
      - "<yellow>Left Click: Upgrade 1 Level"
      - "<yellow>Right Click: Upgrade 10 Levels"
    left-actions: ["[upgrade]"]
    right-actions: ["[upgrade:10]"]
  close:
    slot: 22
    item: "VANILLA:BARRIER"
    name: "<red>Close"
    actions: ["[close]"]
  back:
    slot: 18
    item: "VANILLA:OAK_DOOR"
    name: "<gray>Back to MPC Shop"
    actions: ["[open:energyshop]"]
