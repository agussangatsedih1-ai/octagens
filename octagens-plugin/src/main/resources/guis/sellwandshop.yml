# Six-row Sellwand Shop. All visual elements are editable here.
menu:
  rows: 6
  title: "<gradient:#d4af37:#fff1a8><bold>✦ SELLWAND COLLECTION ✦</bold></gradient>"
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  frame:
    enabled: true
    material: PURPLE_STAINED_GLASS_PANE
    name: " "
    slots: [0-8, 9, 17, 18, 26, 27, 35, 36-44, 45-53]
  accents:
    material: YELLOW_STAINED_GLASS_PANE
    name: " "
    slots: [0, 8, 45, 53, 4, 49]
  sellwand-slots: [20, 22, 24, 29, 31, 33]

sellwand-item:
  # Optional display-only icon override. Leave commented/omitted to use each configured Sellwand item.
  # material: NETHER_STAR
  name: "<gradient:#f8d878:#fff1b8><bold>✦ {name} SELLWAND ✦</bold></gradient>"
  glow: true
  lore:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "<gray>✧ <white>Uses: <aqua>{uses}"
    - "<gray>✧ <white>Sell Multiplier: <green><bold>{multiplier}x"
    - "<gray>✧ <white>Cooldown: <yellow>{cooldown}s"
    - ""
    - "<gold><bold>PRICE"
    - "<yellow>◆ <white>{price}"
    - ""
    - "<green>✔ <white>Sell generator drops from containers."
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "<yellow><bold>➜ CLICK TO PURCHASE"

decorations:
  header:
    slot: 4
    material: NETHER_STAR
    glow: true
    name: "<gradient:#f8d878:#fff1b8><bold>✦ THE MERCHANT'S VAULT ✦</bold></gradient>"
    lore:
      - "<gray>Choose your Sellwand tier."
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "<gold>✧ <white>Each wand has its own uses and sell bonus."
      - "<gold>✧ <white>Prices and tiers are configurable."
  footer:
    slot: 40
    material: BOOK
    name: "<aqua><bold>✧ HOW TO USE</bold>"
    lore:
      - "<gray>Hold your Sellwand."
      - "<gray>Right-click a supported container."
      - "<gray>Generator drops inside will be sold."

close:
  enabled: true
  slot: 49
  material: BARRIER
  glow: false
  name: "<red><bold>✕ CLOSE SHOP</bold>"
  lore:
    - "<gray>Return to your adventure."
