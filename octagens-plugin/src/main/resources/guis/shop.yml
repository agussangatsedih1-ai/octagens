# ======================================================================
#  OctaGens - guis/shop.yml  (Generator Shop, paginasi otomatis)
#  content-slots : slot tempat 20 generator ditampilkan (urut sesuai shop-slot di generators/generators.yml).
#                  Bila generator lebih banyak dari slot, halaman dibuat otomatis.
#  function: PREV / NEXT = tombol halaman (hanya muncul bila ada halaman tersebut)
#  entry-lore    : baris tambahan di bawah lore generator.
#                  Placeholder: {price} {sell_price} {drop_name} {amount} {interval} {energy} {tier} {status}
#  Title placeholder: {page} {pages}.  Teks memakai token {lang:kunci} dari folder lang/.
# ======================================================================
title: "<gradient:#4facfe:#00f2fe><bold>Generator Shop</bold></gradient> <dark_gray>({page}/{pages})"
rows: 4
filler:
  item: "VANILLA:BLACK_STAINED_GLASS_PANE"
  name: " "
content-slots: ["10-16", "19-25"]
entry-lore:
  - ""
  - "<gray>❖ {lang:gui-entry-price}"
  - "<gray>✦ {lang:gui-entry-drop}"
  - "<gray>⚡ {lang:gui-entry-cost}"
  - ""
  - "<gray>{lang:gui-entry-status}"
  - "<yellow>➤ {lang:gui-click-buy}"
items:
  prev:
    slot: 30
    function: PREV
    item: "VANILLA:ARROW"
    name: "<yellow>{lang:gui-prev}"
  close:
    slot: 31
    item: "VANILLA:BARRIER"
    name: "<red>{lang:gui-close}"
    actions: ["[close]"]
  back:
    slot: 27
    item: "VANILLA:OAK_DOOR"
    name: "<gray>{lang:gui-main-menu}"
    actions: ["[open:main]"]
  next:
    slot: 32
    function: NEXT
    item: "VANILLA:ARROW"
    name: "<yellow>{lang:gui-next}"
