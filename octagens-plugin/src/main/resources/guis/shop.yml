# ======================================================================
#  OctaGens - guis/shop.yml  (Generator Shop, paginasi otomatis)
#  content-slots : slot tempat 20 generator ditampilkan (urut sesuai shop-slot di generators.yml).
#                  Bila generator lebih banyak dari slot, halaman dibuat otomatis.
#  function: PREV / NEXT = tombol halaman (hanya muncul bila ada halaman tersebut)
#  entry-lore    : baris tambahan di bawah lore generator.
#                  Placeholder: {price} {sell_price} {drop_name} {amount} {interval} {energy} {tier} {status}
#  Title placeholder: {page} {pages}
# ======================================================================
title: "<gradient:#4facfe:#00f2fe><bold>Generator Shop</bold></gradient> <dark_gray>({page}/{pages})"
rows: 4
filler:
  item: "VANILLA:BLACK_STAINED_GLASS_PANE"
  name: " "
content-slots: ["10-16", "19-25"]
entry-lore:
  - ""
  - "<gray>Harga: <gold>{price}"
  - "<gray>Drop: <white>{drop_name} <dark_gray>(jual <green>{sell_price}<dark_gray>)"
  - "<gray>Konsumsi energy: <aqua>{energy} Mcu <gray>per drop"
  - ""
  - "<gray>Status: {status}"
  - "<yellow>Klik untuk membeli"
items:
  prev:
    slot: 30
    function: PREV
    item: "VANILLA:ARROW"
    name: "<yellow>« Halaman sebelumnya"
  close:
    slot: 31
    item: "VANILLA:BARRIER"
    name: "<red>Tutup"
    actions: ["[close]"]
  back:
    slot: 27
    item: "VANILLA:OAK_DOOR"
    name: "<gray>Menu utama"
    actions: ["[open:main]"]
  next:
    slot: 32
    function: NEXT
    item: "VANILLA:ARROW"
    name: "<yellow>Halaman berikutnya »"
