# ======================================================================
#  OctaGens - lang/en.yml  (English)
#  Bahasa dipilih di config.yml -> general.language (id, en, zh, ja, es).
#  Placeholder dalam kurung kurawal; {prefix} diisi otomatis. Mendukung MiniMessage, &-legacy dan hex.
#  Token {lang:kunci} di file yml lain (guis/, generators/, energy/, sellwand/) diganti teks dari file ini.
# ======================================================================
