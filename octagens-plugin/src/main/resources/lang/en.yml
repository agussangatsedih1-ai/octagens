help:
  - "{prefix}<white>OctaGens commands:"
  - " <aqua>/octagens <gray>- main menu"
  - " <aqua>/octagens shop <gray>- generator shop"
  - " <aqua>/octagens magiculeshop <gray>- collector shop & max Mcu upgrade"
  - " <aqua>/octagens upgrade [amount|max] <gray>- upgrade max Mcu"
  - " <aqua>/octagens sell [hand] <gray>- sell drops"
  - " <aqua>/octagens trade [category] <gray>- trade drops for items"
  - " <aqua>/octagens list <gray>- your generators & collectors"
  - " <aqua>/octagens version <gray>- plugin version"
help-admin:
  - " <gold>/octagens give <player> <generator|energy> <id> [amount]"
