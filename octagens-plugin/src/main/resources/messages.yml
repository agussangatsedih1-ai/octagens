# ======================================================================
#  OctaGens - messages.yml
#  Placeholder dalam kurung kurawal. {prefix} diisi otomatis.
#  Mendukung MiniMessage, &-legacy dan hex.
# ======================================================================
prefix: "<gradient:#a18cd1:#fbc2eb><bold>OctaGens</bold></gradient> <dark_gray>»</dark_gray> "

no-permission: "{prefix}<red>Kamu tidak punya izin untuk itu."
player-only: "{prefix}<red>Command ini hanya untuk player."
unknown-command: "{prefix}<red>Subcommand tidak dikenal. Ketik <white>/octagens help<red>."
reloaded: "{prefix}<green>Semua config berhasil di-reload."
invalid-player: "{prefix}<red>Player <white>{player}<red> tidak ditemukan."
invalid-id: "{prefix}<red>ID <white>{id}<red> tidak ditemukan."
invalid-number: "{prefix}<red>Angka tidak valid: <white>{value}"
invalid-duration: "{prefix}<red>Durasi tidak valid: <white>{value} <gray>(contoh: 30m, 2h, 1d)"
usage-give: "{prefix}<yellow>/octagens give <player> <generator|energy> <id> [jumlah]"
usage-remove: "{prefix}<yellow>/octagens remove <player> <generators|energy|all> [id]"
usage-setbonus: "{prefix}<yellow>/octagens setbonus <multiplier|off> [durasi]"

help:
  - "{prefix}<white>Perintah OctaGens:"
  - " <aqua>/octagens <gray>- menu utama"
  - " <aqua>/octagens shop <gray>- toko generator"
  - " <aqua>/octagens energyshop <gray>- toko energy"
  - " <aqua>/octagens sell [hand] <gray>- jual drop"
  - " <aqua>/octagens list <gray>- generator & energy milikmu"
help-admin:
  - " <gold>/octagens give <player> <generator|energy> <id> [jumlah]"
  - " <gold>/octagens remove <player> <generators|energy|all> [id]"
  - " <gold>/octagens setbonus <multiplier|off> [durasi]"
  - " <gold>/octagens reload"

