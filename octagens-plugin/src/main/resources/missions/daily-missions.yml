# Daily mission definitions. The reset clock is independent of the server timezone.
timezone: "Asia/Jakarta" # WIB; 00:00 WIB = 17:00 UTC on the previous day
menu:
  title: "<gradient:#7F00FF:#E100FF><bold>Daily Missions</bold></gradient>"
notifications:
  reset: "<gold><bold>DAILY MISSIONS RESET!</bold> <yellow>Misi harian sudah diperbarui. Ketik <white>/dailymissions<yellow>."
  reminder: "<yellow>Masih ada Daily Mission yang belum kamu selesaikan atau klaim. Ketik <white>/dailymissions<yellow> untuk melihat progres."
  reminder-interval-seconds: 60
missions:
  sell-generator-drop:
    name: "Sell Generator Drop"
    event: SELL_GENERATOR_DROP
    target: 64
    icon: HOPPER
    rewards:
