name: OctaGens
version: '${project.version}'
main: com.octagens.plugin.OctaGensPlugin
api-version: '1.21'
authors: [OctaGens]
description: Generator drop bertema fantasy dengan pool energy Magicule (Mcu), sellwand, weekend bonus, dan ore generator.
website: https://repo.example.com/

# Vault, PlaceholderAPI dan CoreProtect WAJIB. Dideklarasikan softdepend supaya
# plugin sendiri yang menampilkan pesan error jelas lalu mematikan dirinya.
softdepend: [Vault, PlaceholderAPI, CoreProtect, MMOItems, MythicLib, ItemsAdder, ExcellentEconomy]

# Library runtime, diunduh otomatis oleh server (Maven Central) saat start pertama.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.xerial:sqlite-jdbc:3.46.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1
  - org.slf4j:slf4j-api:2.0.13

commands:
  octagens:
    description: Menu utama OctaGens
    aliases: [ogens, og]
    permission: octagens.use
    usage: /<command> [shop|magiculeshop|upgrade|sell|list|version|give|sellwand|settexture|remove|setbonus|reload]

permissions:
  octagens.use:
    description: Memakai/menempatkan generator dan command dasar
    default: true
  octagens.sellwand.use:
    description: Memakai sellwand pada generator
    default: true
  octagens.edit:
    description: Edit/pickup/pindah generator & energy milik orang lain
    default: op
  octagens.generatorslot.*:
    description: Slot generator tak terbatas
    default: false
  octagens.energyslot.*:
    description: Slot energy tak terbatas
    default: false
  octagens.admin.give:
    description: /octagens give, sellwand give, settexture
    default: op
  octagens.admin.remove:
    description: /octagens remove
    default: op
  octagens.admin.bonus:
    description: /octagens setbonus
    default: op
  octagens.admin.reload:
    description: /octagens reload
    default: op
  octagens.admin.bypass:
    description: Bypass batas slot generator dan energy
    default: op
  octagens.admin.*:
    description: Semua permission admin OctaGens
    default: op
    children:
      octagens.edit: true
      octagens.admin.give: true
      octagens.admin.remove: true
      octagens.admin.bonus: true
      octagens.admin.reload: true
      octagens.admin.bypass: true
