# ======================================================================
#  OctaGens - sellwand.yml
#  Sellwand = tongkat untuk MENJUAL drop generator OctaGens yang ada di dalam chest/container.
#  Cara pakai: pegang sellwand lalu KLIK KANAN container. Hanya item drop OctaGens (dikenali lewat PDC)
#  yang dijual; item lain di container tidak disentuh. Uang masuk ke pemegang sellwand.
#
#  Berikan dengan:  /octagens sellwand give <player> <wand_id> [jumlah] [uses]
#  Permission pakai: octagens.sellwand.use (default: semua pemain)
#
#  Per wand:
#    item        ref item (VANILLA:... / MMOITEMS:... / ITEMSADDER:... / HEAD:...)
#    name, lore  placeholder: {id} {uses} {multiplier} {cooldown}   ({uses} = "∞" bila tak terbatas)
#    uses        jumlah pemakaian (1 pemakaian = 1 kali berhasil menjual); -1 = tak terbatas
#    multiplier  pengali harga jual (dikali multiplier permission octagens.sellmultiplier.<x> milik pemain)
#    cooldown-ms jeda antar pemakaian
#    custom-model-data / item-model / glow : tampilan item
#
#  Keamanan: jika plugin proteksi (WorldGuard, claim, dll) menolak akses ke container, sellwand tidak jalan.
#  Penjualan dicatat ke console/sell-log dan ke CoreProtect (coreprotect.log-sellwand).
# ======================================================================
settings:
  success-sound: "entity.experience_orb.pickup"   # kosongkan untuk mematikan
  broken-sound: "entity.item.break"
  # Container yang boleh dijual. Nama material; "SHULKER_BOX" cocok dengan semua warna shulker box.
  containers:
    - CHEST
    - TRAPPED_CHEST
    - BARREL
    - SHULKER_BOX
    - HOPPER
    - DROPPER
    - DISPENSER

wands:
  basic:
    item: "VANILLA:STICK"
    name: "<gradient:#f7971e:#ffd200><bold>Sellwand</bold></gradient> <gray>(Basic)"
    lore:
      - "<dark_gray>▪ <gray>Jual drop generator di dalam container."
      - ""
      - "<gray>Pemakaian: <white>{uses}"
      - "<gray>Multiplier: <gold>x{multiplier}"
      - "<gray>Cooldown: <white>{cooldown}s"
      - ""
      - "<yellow>Klik kanan chest/barrel untuk menjual"
    glow: true
    custom-model-data: 0
    uses: 50
    multiplier: 1.0
    cooldown-ms: 1500
  advanced:
    item: "VANILLA:BLAZE_ROD"
    name: "<gradient:#4facfe:#00f2fe><bold>Sellwand</bold></gradient> <gray>(Advanced)"
    lore:
      - "<dark_gray>▪ <gray>Jual drop generator di dalam container."
      - ""
      - "<gray>Pemakaian: <white>{uses}"
      - "<gray>Multiplier: <gold>x{multiplier}"
      - "<gray>Cooldown: <white>{cooldown}s"
      - ""
      - "<yellow>Klik kanan chest/barrel untuk menjual"
    glow: true
    custom-model-data: 0
    uses: 250
    multiplier: 1.25
    cooldown-ms: 1000
  master:
    item: "VANILLA:END_ROD"
    name: "<gradient:#f093fb:#f5576c><bold>Sellwand</bold></gradient> <gray>(Master)"
    lore:
      - "<dark_gray>▪ <gray>Jual drop generator di dalam container."
      - ""
      - "<gray>Pemakaian: <white>{uses}"
      - "<gray>Multiplier: <gold>x{multiplier}"
      - "<gray>Cooldown: <white>{cooldown}s"
      - ""
      - "<yellow>Klik kanan chest/barrel untuk menjual"
    glow: true
    custom-model-data: 0
    uses: -1
    multiplier: 1.5
    cooldown-ms: 500
