# ======================================================================
#  OctaGens - trade/trade.yml   (dibuka dengan /octagens trade [kategori])
#  Tukar drop generator (dan item lain) dengan hadiah, mis. item MMOItems.
#  Buat kategori sebanyak yang Anda mau; tiap kategori punya trade sebanyak yang Anda mau.
#  Semuanya bebas diedit lalu /octagens reload. TIDAK ada tombolnya di menu /octagens (hanya lewat command).
#
#  categories:
#    <id_kategori>:
#      display-name   nama kategori (hex/gradient/MiniMessage)
#      icon           ikon di daftar kategori: string ref ATAU section {item, name, lore, glow, custom-model-data}
#      permission     (opsional) permission untuk membuka kategori
#      trades:
#        <id_trade>:
#          result        item hadiah (ref): MMOITEMS:TYPE:ID | VANILLA:X | ITEMSADDER:ns:id | HEAD:<base64>
#          amount        jumlah hadiah (default 1)
#          display       (opsional) override tampilan ikon: section {item, name, lore, ...}
#          ingredients   daftar bahan "<jumlah>x <ref>". Ref yang bisa dipakai:
#                          DROP:<id_generator>      drop hasil generator (mis. DROP:lesser_mana)
#                          ENERGY:<id> / GENERATOR:<id>   item collector / generator OctaGens
#                          VANILLA:X (item polos) | MMOITEMS:TYPE:ID | ITEMSADDER:ns:id
#          requirements  (opsional) syarat tambahan:
#                          permission   permission khusus trade ini
#                          money        biaya uang, currency: "vault" atau "excellenteconomy:<id>"
#                          placeholders daftar syarat PlaceholderAPI. Format "%placeholder% <op> nilai"
#                                       dengan op: >= <= > < == !=  (angka atau teks). Bisa juga map
#                                       {condition: "...", description: "teks yang tampil"}
#          limit         batas penukaran per pemain (0 = tanpa batas, tersimpan di database)
#          commands      (opsional) perintah tambahan: "[console] give {player} ..." atau "[player] ..."
#
#  Penukaran bersifat ATOMIK: semua bahan, uang, dan syarat dicek dulu; bila ada yang kurang tidak ada yang diambil.
#  Trade yang memakai MMOITEMS/ITEMSADDER otomatis "Tidak tersedia" bila plugin-nya tidak terpasang atau item tidak ada.
#  CONTOH di bawah memakai ID MMOItems fiktif: ganti dengan ID item MMOItems Anda sendiri.
# ======================================================================
categories:
  weapons:
    display-name: "<gradient:#f12711:#f5af19><bold>Weapons</bold></gradient>"
    icon:
      item: "VANILLA:DIAMOND_SWORD"
      glow: true
      lore:
        - "<gray>Tukar drop generator dengan senjata MMOItems."
    trades:
      mystic_blade:
        result: "MMOITEMS:SWORD:MYSTIC_BLADE"
        amount: 1
        ingredients:
          - "64x DROP:lesser_mana"
          - "32x DROP:arcane_shard"
        requirements:
          money: 50000
          currency: "vault"
        limit: 0
      astral_bow:
        result: "MMOITEMS:BOW:ASTRAL_BOW"
        amount: 1
        ingredients:
          - "128x DROP:mystic_orb"
          - "64x DROP:enchanted_rune"
        requirements:
          placeholders:
            - condition: "%octagens_generators_placed% >= 3"
              description: "Place at least 3 generators"
        limit: 1
  materials:
    display-name: "<gradient:#4facfe:#00f2fe><bold>Materials</bold></gradient>"
    icon:
      item: "VANILLA:AMETHYST_SHARD"
      glow: true
      lore:
        - "<gray>Bahan crafting MMOItems."
    trades:
      polished_diamond:
        result: "MMOITEMS:MATERIAL:POLISHED_DIAMOND_BLOCK"
        amount: 2
        ingredients:
          - "100x DROP:soul_essence"
          - "50x DROP:aether_crystal"
        requirements:
          permission: ""
  starter:
    display-name: "<gradient:#43e97b:#38f9d7><bold>Starter (tanpa MMOItems)</bold></gradient>"
    icon:
      item: "VANILLA:EMERALD"
    trades:
      lapis_bundle:
        result: "VANILLA:DIAMOND"
        amount: 3
        ingredients:
          - "32x DROP:lesser_mana"
        limit: 5
